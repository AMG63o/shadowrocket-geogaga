name: Update GeoGaGa rules

on:
  push:
    branches: [main]
    paths-ignore:
      - 'rules/**'
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-geogaga-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch source GeoGaGa lists
        run: |
          set -euo pipefail
          rm -rf /tmp/geogaga-source
          git clone --depth 1 --branch lists https://github.com/bratishkadrugoimamysynishka/geogaga-client-flavor.git /tmp/geogaga-source

      - name: Build Shadowrocket rule sets
        run: |
          set -euo pipefail
          python3 scripts/build.py

      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A rules/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update GeoGaGa rules"
          git push
